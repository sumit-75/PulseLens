<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181711" />
      <stop offset="100%" stop-color="#0e0d08" />
    </linearGradient>

    <!-- Pulse Wave Stroke Gradient -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#889089" />
      <stop offset="50%" stop-color="#e2e7e3" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#34d399" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Accent Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#e2e7e3" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Pulse Waveform Polyline -->
  <polyline
    points="10,33 20,33 26,18 34,48 42,24 48,33 54,33"
    fill="none"
    stroke="url(#pulseGradient)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Emerald Live Indicator Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#34d399" />
  <circle cx="50" cy="14" r="5" fill="none" stroke="#34d399" stroke-opacity="0.5" stroke-width="1" />
</svg>
